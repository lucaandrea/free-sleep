name: CI

on:
  pull_request:

jobs:
  bedside:
    name: Bedside account and control contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: espressif/esp-idf
          ref: b774170ff46c393eeb5e495ea37936038d3f4f4f
          path: .bedside-sdk
          persist-credentials: false
      - name: Read the SDK's pinned JSON dependency
        run: git -C .bedside-sdk submodule update --init --depth 1 components/json/cJSON
      - name: Test firmware contracts and private pairing
        env:
          IDF_PATH: ${{ github.workspace }}/.bedside-sdk
        working-directory: firmware/waveshare-amoled
        run: |
          cmake -S tests -B test-build
          cmake --build test-build --parallel 2
          ctest --test-dir test-build --output-on-failure
          python3 -m unittest discover -s tests -p 'test_*.py' -v

  private-access:
    name: Windows private-access ownership
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Windows PowerShell syntax and service ownership
        shell: powershell
        run: ./scripts/home/Test-PrivateHomeAccess.ps1

  hosted:
    name: Replit build and gateway transport
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json
            gateway/package-lock.json
      - name: Build and test using the deployment command
        run: node scripts/build-hosted.mjs
      - name: Test web contracts
        run: npm --prefix app test

  biometrics:
    name: Biometrics (Python ${{ matrix.python-version }}, cbor2 ${{ matrix.cbor-version }})
    # Keep the Pod's older Python compatibility checks on a supported runner.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - python-version: '3.9'
            cbor-version: '5.6.5'
          - python-version: '3.10'
            cbor-version: '5.8.0'
          - python-version: '3.10'
            cbor-version: '6.1.5'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install biometrics dependencies
        run: python -m pip install -r biometrics/requirements.txt "cbor2==${{ matrix.cbor-version }}"
      - name: Test biometrics
        run: python -m unittest discover -s biometrics/tests -v
      - name: Test maintenance and dependency installation
        run: python -m unittest discover -s scripts/tests -v

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            ./app/package-lock.json
            ./server/package-lock.json

      - name: Install dependencies (app)
        working-directory: app
        run: npm ci

      - name: Install dependencies (server)
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npm run generate

      - name: Test server contracts
        working-directory: server
        run: npm test

      - name: Build (server)
        working-directory: server
        run: npm run build:pr

      - name: Build (app)
        working-directory: app
        run: npm run build:pr

      - name: Require clean working directory
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package-name:
          - app
          - server

    defaults:
      run:
        working-directory: ${{ matrix.package-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: ./${{ matrix.package-name }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
